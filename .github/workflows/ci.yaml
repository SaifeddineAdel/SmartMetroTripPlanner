name: Smart Metro CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test .Net Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Backend/SmartMetroTripPlanner.slnx

      - name: Build Solution
        run: dotnet build Backend/SmartMetroTripPlanner.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test Backend/SmartMetroTripPlanner.slnx --configuration Release --no-build --no-restore