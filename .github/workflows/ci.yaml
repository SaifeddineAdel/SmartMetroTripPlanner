name: Smart Mertro CI

on:
  push:

  pull_request:
    branches:
      - main
  
  workflow_dispatch:

permissions:
  content: read
  
jobs:
  build-and-test:
    name: Build and Test .Net Solution
    runs-on : ubuntu-latest
  
    steps:
      # 1. Download repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # 2. Install .Net 10 SDK
      - name: Setup .Net 
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      
      # 3. Restore NuGet dependencies
      - name: Restore Dependencies
        run: dotnet restore SmartMetroTripPlanner.slnx

      # 4. Build all projects
      - name: Build Solution
        run: dotnet build SmartMetroTripPlanner.slnx --configuration Release --no-restore

      # 5. Run automated tests
      - name: Run Unit Tests
        run: dotnet test SmartMetroTripPlanner.slnx --configuration Release --no-build --no-restore