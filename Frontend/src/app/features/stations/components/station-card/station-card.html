<div class="station-card" [class.flipped]="isFlipped">

    <div class="station-card-inner">

        <!-- Front Side -->
        <div class="station-card-front">

            <div class="station-icon">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="5" y="3" width="14" height="16" rx="3"></rect>
                    <path d="M8 19l-2 2"></path>
                    <path d="M16 19l2 2"></path>
                    <path d="M8 8h8"></path>
                    <path d="M8 13h.01"></path>
                    <path d="M16 13h.01"></path>
                </svg>
            </div>

            <div class="station-info">
                <span class="station-label">METRO STATION</span>
                <h3>{{ station().name }}</h3>
            </div>

            <button
                class="station-arrow"
                type="button"
                aria-label="Show station description"
                (click)="toggleFlip()"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="19"
                    height="19"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M5 12h14"></path>
                    <path d="m12 5 7 7-7 7"></path>
                </svg>
            </button>

        </div>

        <!-- Back Side -->
        <div class="station-card-back">

            <div class="station-back-info">
                <span class="station-label">ABOUT STATION</span>
                <h3>{{ station().name }}</h3>
                <p>{{ station().description }}</p>
            </div>

            <button
                class="station-arrow back-arrow"
                type="button"
                aria-label="Back to station"
                (click)="toggleFlip()"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="19"
                    height="19"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M19 12H5"></path>
                    <path d="m12 19-7-7 7-7"></path>
                </svg>
            </button>

        </div>

    </div>

</div>
